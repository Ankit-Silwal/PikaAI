name: pikaai

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rag:
    build: ./apps/rag
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-learning_rag}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      api_key: ${api_key:-${GEMINI_API_KEY:-}}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - embedding_cache:/root/.cache/huggingface
    depends_on:
      - qdrant

volumes:
  embedding_cache:
  qdrant_data:
  postgres_data:
  redis_data:
